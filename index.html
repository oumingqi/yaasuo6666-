  /* 液态玻璃底部导航栏 */
  .bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 420px;
    height: 76px;
    border-radius: 38px;
    z-index: 9999;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    cursor: grab;
    overflow: hidden;
    isolation: isolate;

    background: rgba(255, 255, 255, 0.42);
    backdrop-filter: blur(28px) saturate(230%) brightness(1.05);
    -webkit-backdrop-filter: blur(28px) saturate(230%) brightness(1.05);

    box-shadow:
      0 16px 44px rgba(31, 45, 61, 0.24),
      0 2px 8px rgba(31, 45, 61, 0.1),
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 0 rgba(255, 255, 255, 0.4);

    border: 1px solid rgba(255, 255, 255, 0.7);
  }
  .bottom-nav.dragging { cursor: grabbing; }

  .bottom-nav::before {
    content: "";
    position: absolute;
    left: 10%; right: 10%; top: 5px;
    height: 1.5px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,1) 50%,
      rgba(255,255,255,0) 100%);
    pointer-events: none;
    z-index: 3;
  }

  .nav-blob {
    position: absolute;
    top: 6px; left: 6px;
    height: calc(100% - 12px);
    width: calc((100% - 12px) / 3);
    border-radius: 32px;
    background: linear-gradient(180deg,
      #ffffff 0%,
      #e8f0ff 45%,
      #c4d9ff 100%);
    box-shadow:
      0 8px 24px rgba(91, 141, 239, 0.55),
      0 2px 8px rgba(31, 45, 61, 0.18),
      inset 0 1.5px 0 rgba(255, 255, 255, 1),
      inset 0 -2px 6px rgba(91, 141, 239, 0.28);
    border: 1.5px solid rgba(255, 255, 255, 0.98);
    outline: 1px solid rgba(91, 141, 239, 0.35);
    outline-offset: -2px;
    transition: transform 0.42s cubic-bezier(0.22, 1.2, 0.36, 1),
                width 0.42s cubic-bezier(0.22, 1.2, 0.36, 1),
                box-shadow 0.25s ease;
    pointer-events: none;
    z-index: 1;
    will-change: transform;
  }
  .bottom-nav.dragging .nav-blob {
    transition: box-shadow 0.2s ease;
    box-shadow:
      0 12px 32px rgba(91, 141, 239, 0.75),
      0 4px 12px rgba(31, 45, 61, 0.22),
      inset 0 1.5px 0 rgba(255, 255, 255, 1),
      inset 0 -2px 8px rgba(91, 141, 239, 0.4);
  }

  .nav-items {
    position: relative;
    z-index: 2;
    display: flex;
    width: 100%;
    height: 100%;
  }
  .nav-item {
    flex: 1;

    text-decoration: none;
    font-size: 0.68rem;
    font-weight: 500;
    transition: color 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .nav-item i {
    font-size: 1.15rem;
    transition: transform 0.3s ease;
  }
  .nav-item.active {
    color: #1b4fd1;
    font-weight: 800;
  }
  .nav-item.active i {

  }

  @media (max-width: 480px) {

    .avatar { width: 116px; height: 116px; }
    .section { padding: 60px 20px; }
  }
</style>
</head>

<nav class="bottom-nav" id="bottomNav">

<script>
  (function () {
    "use strict";

    var nav   = document.getElementById('bottomNav');
    var blob  = document.getElementById('navBlob');
    var items = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'));
    var n     = items.length;
    var current  = 0;
    var dragging = false;
    var blobLeft = 0;

    function getItemWidth() {
      return (nav.clientWidth - 12) / n;
    }
    function getTargetLeft(index) {
      return 6 + getItemWidth() * index;
    }
    function getBlobWidth() {
      return getItemWidth();
    }

    function setBlobTransform() {
      var translate = blobLeft - 6;
      var scale = dragging ? 1.08 : 1;
      blob.style.transform = 'translateX(' + translate + 'px) scale(' + scale + ')';
    }

    function applyBlob(useTransition) {
      if (!useTransition) {
        blob.style.transition = 'none';
        void blob.offsetWidth;
      } else {
        blob.style.transition = '';
      }
      blob.style.width = getBlobWidth() + 'px';
      blobLeft = getTargetLeft(current);
      setBlobTransform();
    }

    function setActive(index) {
      current = index;
      items.forEach(function (el, i) {
        el.classList.toggle('active', i === index);
      });
    }

    var ids = ['home', 'download', 'contact'];
    function scrollToIndex(index) {
      var target = document.getElementById(ids[index]);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function onPointerDown(e) {
      dragging = true;
      nav.classList.add('dragging');
      var rect = nav.getBoundingClientRect();
      var x = e.clientX - rect.left;
      moveBlobTo(x - getBlobWidth() / 2);
      if (nav.setPointerCapture) nav.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
      if (!dragging) return;
      var rect = nav.getBoundingClientRect();
      var x = e.clientX - rect.left;
      moveBlobTo(x - getBlobWidth() / 2);
    }

    function onPointerUp(e) {
      if (!dragging) return;
      dragging = false;
      nav.classList.remove('dragging');

      var itemW = getItemWidth();
      var blobCenter = blobLeft + getBlobWidth() / 2;
      var idx = Math.round((blobCenter - 6 - itemW / 2) / itemW);
      if (idx < 0) idx = 0;
      if (idx > n - 1) idx = n - 1;

      setActive(idx);
      applyBlob(true);
      scrollToIndex(idx);
    }

    function moveBlobTo(left) {
      var w = getBlobWidth();
      var minLeft = 6;
      var maxLeft = nav.clientWidth - 6 - w;
      if (left < minLeft) left = minLeft;
      if (left > maxLeft) left = maxLeft;
      blobLeft = left;
      setBlobTransform();
    }

    nav.addEventListener('pointerdown', onPointerDown);
    nav.addEventListener('pointermove', onPointerMove);
    nav.addEventListener('pointerup', onPointerUp);
    nav.addEventListener('pointercancel', onPointerUp);

    items.forEach(function (el, i) {
      el.addEventListener('click', function (ev) {
        ev.preventDefault();
        if (dragging) return;
        setActive(i);
        applyBlob(true);
        scrollToIndex(i);
      });
    });

    nav.addEventListener('touchmove', function (e) {
      if (dragging) e.preventDefault();
    }, { passive: false });

    window.addEventListener('resize', function () { applyBlob(false); });
    window.addEventListener('load',   function () { applyBlob(false); });
    applyBlob(false);

    var sections = document.querySelectorAll('section[id]');
    if ('IntersectionObserver' in window) {
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var id = entry.target.getAttribute('id');
            var idx = ids.indexOf(id);
            if (idx >= 0 && idx !== current) {
              setActive(idx);
              applyBlob(true);
            }
          }
        });
      }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
      sections.forEach(function (s) { spy.observe(s); });
    }

  })();
</script>
